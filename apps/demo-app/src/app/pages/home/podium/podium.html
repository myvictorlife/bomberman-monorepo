@if (status() === 'ready') {
<lib-podium
  class="podium-board"
  variant="stage"
  [entries]="entries()"
  [paint]="paint"
/>
<div class="podium__actions">
  <a routerLink="/online" libButton variant="secondary" size="md"
    >{{ 'HOME.PODIUM_SEE_ALL' | translate }}</a
  >
</div>
} @else if (status() === 'empty') {
<div class="podium__empty" data-testid="podium-empty">
  <p>{{ 'HOME.PODIUM_EMPTY' | translate }}</p>
  <a routerLink="/online" libButton variant="primary" size="md" class="home-cta"
    >{{ 'HOME.PODIUM_CLAIM' | translate }}</a
  >
</div>
}
