<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Detona</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b12" />
    <!-- Added to a phone's home screen, the game opens without the browser's
         bars: the only way to a full-screen arena on an iPhone. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta
      name="description"
      content="Template moderno para aplicações web com Angular, Nx e NgRx."
    />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Inter is self-hosted from /fonts (see src/fonts.css): no third-party
         domain in the critical rendering path. Preload the two weights used
         above the fold. -->
    <link
      rel="preload"
      href="/fonts/inter-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
